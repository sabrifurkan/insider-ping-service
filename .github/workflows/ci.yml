name: CI

# When does this pipeline run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---- Job 1: install deps, run tests, build the image ----
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      # Same Dockerfile the cluster uses. If it can't build, CI fails.
      - name: Build Docker image
        run: docker build -t insider-ping:ci .

  # ---- Job 2 (bonus): push the image to GitHub Container Registry ----
  # Runs only after the tests pass, and only on push to main (not on PRs).
  publish-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write   # required to push to GHCR with the built-in token
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/insider-ping:latest
            ghcr.io/${{ github.repository_owner }}/insider-ping:${{ github.sha }}
